# Add these locations inside the existing HTTPS server {} block for otzaria.duckdns.org.
# Do not create a second server block and do not replace the rest of the site's config.
location = /mcp {
    proxy_pass http://127.0.0.1:3010/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

location = /mcp-health {
    proxy_pass http://127.0.0.1:3010/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
